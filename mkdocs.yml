site_name: Elan
site_description: Python workflows with branching, concurrency, and runtime expansion.
site_url: https://accelerate-lux.github.io/elan/
repo_url: https://github.com/Accelerate-lux/elan
repo_name: Accelerate-lux/elan
exclude_docs: |
  internals/
  test_plan.md
  explanations/
  /api.md
  /basics.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_root_toc_entry: false
            inherited_members: false
            docstring_style: google

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight:
      use_pygments: true
      pygments_style: github-dark
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite

extra_css:
  - stylesheets/extra.css
  - stylesheets/pygments-github-dark.css

nav:
  - Home: index.md
  - Capability Status: status.md
  - Learn:
      - Getting Started: learn/getting-started.md
      - Core Concepts: learn/core-concepts.md
      - Recommended Patterns: learn/recommended-patterns.md
      - AI Authoring: learn/ai-authoring.md
      - Next Steps: learn/next-steps.md
  - Guides:
      - Linear Workflows: guides/linear-workflows.md
      - Data Binding: guides/data-binding.md
      - Branching: guides/branching.md
      - Joins: guides/join-result.md
      - Context: guides/context.md
      - Composition: guides/composition.md
      - Dynamic Execution: guides/dynamic-execution.md
      - Dynamic Scenarios:
          - Adaptive Research: guides/adaptive-research.md
          - Document Decisioning: guides/document-decisioning.md
          - AI-assisted ETL Recovery: guides/etl-recovery.md
  - Comparisons:
      - Summary: comparison/summary.md
      - Dynamic Models: comparison/dynamic_models.md
      - Shared Baseline: comparison/baseline_workflow.md
      - Airflow: comparison/airflow.md
      - Prefect: comparison/prefect.md
      - Dagster: comparison/dagster.md
      - Metaflow: comparison/metaflow.md
      - Temporal: comparison/temporal.md
      - LangGraph: comparison/langgraph.md
  - Reference:
      - API Overview: reference/api.md
      - Runtime Behavior: reference/runtime-behavior.md
      - Python API: reference/python-api.md
      - Documentation Boundary: publication-policy.md
